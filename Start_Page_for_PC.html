<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Start Page for PC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎶</text></svg>">
    <style>
        :root {
            --md-bg: #f5fafd;
            --md-primary: #0077b6;
            --md-on-surface: #1a1c1e;
            --md-surface-variant: #e1e8ed;
            --md-container: #ffffff;
            --md-link-hover: #e0f2f1;
            --md-danger: #b3261e;
            --font-main: 13px;
        }

        [data-theme="dark"] {
            --md-bg: #1a1c1e;
            --md-primary: #76d1ff;
            --md-on-surface: #e2e2e6;
            --md-surface-variant: #41484d;
            --md-container: #2d3135;
            --md-link-hover: #374955;
            --md-danger: #ff8a80;
        }

        body {
            background-color: var(--md-bg);
            color: var(--md-on-surface);
            font-family: "Google Sans", "BIZ UDPGothic", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: var(--font-main);
            transition: background-color 0.3s ease;
        }

        .container {
            width: 95%;
            max-width: 1600px;
            padding: 20px 0;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--md-primary);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--md-primary);
            margin: 0;
            white-space: nowrap;
        }

        /* トップボタン群(改行はflex-basis:100%の要素で表現) */
        #top-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
        }
        #top-area .brk { flex-basis: 100%; height: 0; }

        .theme-toggle {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--md-primary);
            background: transparent;
            color: var(--md-primary);
            font-size: 0.8rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            margin-left: 4px;
        }
        .theme-toggle:hover { background: var(--md-primary); color: var(--md-bg); }

        .chip {
            background-color: var(--md-surface-variant);
            color: var(--md-on-surface);
            text-decoration: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            transition: background-color 0.2s ease, color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            cursor: pointer;
        }

        .chip:hover { background-color: var(--md-primary); color: #fff; }

        .stack-grid { display: flex; flex-direction: column; gap: 10px; }
        section { background: var(--md-container); padding: 12px 18px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        section.dim { background: var(--md-surface-variant); opacity: 0.9; }
        h2 { font-size: 0.9rem; font-weight: 700; color: var(--md-primary); margin-top: 0; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--md-surface-variant); padding-bottom: 4px; }
        .link-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 2px; min-height: 22px; }
        .link-list:empty::before { content: "— 空(ここにドラッグ) —"; opacity: .5; font-size: .75rem; padding: 2px 6px; grid-column: 1 / -1; }
        .link-list li { border-radius: 3px; }
        .link-list a { text-decoration: none; color: var(--md-on-surface); font-size: 0.82rem; display: block; padding: 2px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .link-list a:hover { background-color: var(--md-link-hover); color: var(--md-primary); padding-left: 10px; }

        /* ドラッグ&ドロップ */
        [data-drag] { cursor: grab; }
        .dragging { opacity: .35; }
        .drop-before { box-shadow: -3px 0 0 var(--md-primary); }
        .drop-after { box-shadow: 3px 0 0 var(--md-primary); }
        .drop-empty { outline: 2px dashed var(--md-primary); outline-offset: 2px; }

        /* データが空のときの案内 */
        #empty-msg { background: var(--md-container); border: 1px dashed var(--md-primary); border-radius: 12px; padding: 28px 20px; text-align: center; line-height: 1.8; }
        #empty-msg p { margin: 0 0 12px; }
        #empty-msg .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        #empty-msg .chip { padding: 6px 14px; }

        /* 設定メニュー */
        #settings-menu {
            position: fixed; z-index: 50; min-width: 220px;
            background: var(--md-container); color: var(--md-on-surface);
            border: 1px solid var(--md-surface-variant); border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,.25); padding: 6px;
        }
        #settings-menu[hidden] { display: none; }
        #settings-menu button {
            display: flex; width: 100%; align-items: center; gap: 8px; text-align: left;
            padding: 8px 10px; border: none; border-radius: 6px; background: transparent;
            color: inherit; font: inherit; font-size: .9rem; cursor: pointer;
        }
        #settings-menu button:hover { background: var(--md-link-hover); color: var(--md-primary); }
        #settings-menu .num { color: var(--md-primary); font-weight: 700; }

        /* 編集ダイアログ */
        #editor { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
        #editor[hidden] { display: none; }
        .ed-panel { background: var(--md-bg); color: var(--md-on-surface); width: min(1100px, 96vw); height: min(88vh, 900px); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow: hidden; }
        .ed-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--md-primary); }
        .ed-head h2 { border: none; margin: 0; padding: 0; font-size: 1rem; }
        .ed-body { overflow: auto; padding: 14px 16px 24px; flex: 1; }
        .ed-note { font-size: .78rem; opacity: .75; margin: 0 0 12px; }
        .ed-block { background: var(--md-container); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        .ed-block h3 { margin: 0 0 8px; font-size: .9rem; color: var(--md-primary); }
        .ed-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
        .ed-row input[type="text"] { font: inherit; font-size: .85rem; padding: 4px 6px; border: 1px solid var(--md-surface-variant); border-radius: 5px; background: var(--md-bg); color: var(--md-on-surface); min-width: 0; }
        .ed-row input[type="text"]:focus-visible { outline: 2px solid var(--md-primary); }
        .ed-icon { width: 3.4em; text-align: center; flex: none; }
        .ed-name { flex: 1 1 180px; }
        .ed-url { flex: 3 1 320px; }
        .ed-chk { display: inline-flex; align-items: center; gap: 3px; font-size: .78rem; white-space: nowrap; flex: none; }
        .ed-break { flex: 1; font-size: .82rem; opacity: .7; border: 1px dashed var(--md-primary); border-radius: 5px; padding: 3px 8px; }
        .ed-sechead { padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--md-surface-variant); }
        .ed-sechead .ed-name { font-weight: 700; }
        .ed-row button, .ed-actions button, .ed-head button { font: inherit; font-size: .8rem; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--md-primary); background: transparent; color: var(--md-primary); cursor: pointer; flex: none; }
        .ed-row button:hover, .ed-actions button:hover, .ed-head button:hover { background: var(--md-primary); color: var(--md-bg); }
        .ed-row button.del { border-color: var(--md-danger); color: var(--md-danger); }
        .ed-row button.del:hover { background: var(--md-danger); color: #fff; }
        .ed-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .ed-level { margin-left: 18px; }
    </style>
</head>
<body>

<div class="container">
<header>
    <h1>Internet Start Page for PC</h1>
    <!-- データ(トップボタン群)はJSONから描画。末尾の固定ボタンは常に表示 -->
    <div id="top-area" data-root="top">
        <button class="chip" id="qr-open-btn" title="QRコード作成" style="padding: 5px 10px;"><span>📱</span></button>
        <button class="theme-toggle" id="settings-btn" title="設定"><span>⚙️</span> 設定</button>
    </div>
</header>

<div id="empty-msg" hidden>
    <p>リンクがまだ登録されていません。<br>「⚙️ 設定」→「URL追加/編集」から追加するか、保存済みのJSONを読み込んでください。</p>
    <div class="btns">
        <button class="chip" id="empty-edit">✏️ URL追加/編集</button>
        <button class="chip" id="empty-import">📂 JSONで読み込み</button>
    </div>
</div>

<div class="stack-grid" id="sections"></div>
</div>

<!-- 設定メニュー -->
<div id="settings-menu" hidden>
    <button id="m-edit"><span class="num">1</span> URL追加/編集</button>
    <button id="m-theme"><span class="num">2</span> <span id="m-theme-label">テーマ切り替え</span></button>
    <button id="m-export"><span class="num">3</span> JSONで書き出し</button>
    <button id="m-import"><span class="num">4</span> JSONで読み込み</button>
</div>
<input type="file" id="file-input" accept=".json,application/json" hidden>

<!-- URL追加/編集ダイアログ -->
<div id="editor" hidden>
    <div class="ed-panel" role="dialog" aria-modal="true" aria-label="URL追加/編集">
        <div class="ed-head">
            <h2>✏️ URL追加/編集</h2>
            <button id="editor-close">閉じる</button>
        </div>
        <div class="ed-body" id="editor-body"></div>
    </div>
</div>

<script>
/* ===== ヘルパー ===== */
function openRightWindow(url) {
    var w = 500;
    var h = 600;
    var l = window.screen.width - w - 10;
    var t = 10;
    window.open(url, 'chargingCalc', 'width=' + w + ',height=' + h + ',left=' + l + ',top=' + t + ',scrollbars=yes,resizable=yes');
}

const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) {
        const v = attrs[k];
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
        else if (k === 'value' || k === 'checked') e[k] = v;
        else e.setAttribute(k, v);
    }
    kids.forEach((c) => { if (c) e.append(c); });
    return e;
}
function safeHref(url) {
    const u = String(url || '').trim();
    return /^(javascript|vbscript|data):/i.test(u) ? '#' : u;
}

/* ===== データ(JSONで保存・読込。このHTMLにはURLを持たない) ===== */
const DATA_KEY = 'PC_homepage_data_v1';
const THEME_KEY = 'PC_homepage_theme';

function str(v) { return typeof v === 'string' ? v : (v == null ? '' : String(v)); }
function normalize(d) {
    const out = { version: 1, topLinks: [], sections: [] };
    (Array.isArray(d.topLinks) ? d.topLinks : []).forEach((t) => {
        if (!t || typeof t !== 'object') return;
        if (t.type === 'break') out.topLinks.push({ type: 'break' });
        else out.topLinks.push({ type: 'link', icon: str(t.icon), name: str(t.name), url: str(t.url), popup: !!t.popup });
    });
    (Array.isArray(d.sections) ? d.sections : []).forEach((s) => {
        if (!s || typeof s !== 'object') return;
        const sec = { icon: str(s.icon), title: str(s.title), dim: !!s.dim, links: [] };
        (Array.isArray(s.links) ? s.links : []).forEach((l) => {
            if (!l || typeof l !== 'object') return;
            sec.links.push({ name: str(l.name), url: str(l.url), popup: !!l.popup });
        });
        out.sections.push(sec);
    });
    return out;
}
function loadData() {
    try {
        const s = localStorage.getItem(DATA_KEY);
        if (s) return normalize(JSON.parse(s));
    } catch (e) {}
    return { version: 1, topLinks: [], sections: [] };
}
let data = loadData();
function save() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); } catch (e) {}
}

/* ===== メイン画面の描画 ===== */
function renderMain() {
    // トップボタン群
    const top = $('top-area');
    const anchor = $('qr-open-btn');
    top.querySelectorAll('.dyn').forEach((n) => n.remove());
    data.topLinks.forEach((it, i) => {
        let n;
        if (it.type === 'break') {
            n = el('div', { class: 'brk dyn', 'data-index': i });
        } else {
            n = el('a', { class: 'chip dyn', href: safeHref(it.url), draggable: 'true', 'data-drag': '1', 'data-cont': 'top', 'data-index': i });
            if (it.icon) n.append(el('span', { text: it.icon }));
            n.append(document.createTextNode(it.name));
            if (it.popup) n.dataset.popup = '1';
        }
        top.insertBefore(n, anchor);
    });

    // セクション
    const wrap = $('sections');
    wrap.textContent = '';
    data.sections.forEach((s, si) => {
        const sec = el('section', { class: s.dim ? 'dim' : '' });
        sec.append(el('h2', {}, el('span', { class: 'title-icon', text: s.icon }), document.createTextNode(s.title)));
        const ul = el('ul', { class: 'link-list', 'data-root': String(si) });
        s.links.forEach((l, li) => {
            const a = el('a', { href: safeHref(l.url), draggable: 'false' });
            a.textContent = l.name;
            if (l.popup) a.dataset.popup = '1';
            ul.append(el('li', { draggable: 'true', 'data-drag': '1', 'data-cont': String(si), 'data-index': li }, a));
        });
        sec.append(ul);
        wrap.append(sec);
    });

    $('empty-msg').hidden = data.topLinks.length > 0 || data.sections.length > 0;
}

// 小窓指定のリンクは右上の小さなウィンドウで開く
document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-popup]');
    if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
        e.preventDefault();
        openRightWindow(a.href);
    }
});

/* ===== ドラッグ&ドロップ ===== */
let drag = null;

function getList(cont) { return cont === 'top' ? data.topLinks : data.sections[+cont].links; }

function dropPos(root, x, y) {
    const items = Array.from(root.querySelectorAll(':scope > [data-drag]'));
    if (!items.length) return { el: null, index: 0, after: false };
    let best = null, bestD = Infinity;
    items.forEach((n) => {
        const r = n.getBoundingClientRect();
        const dx = x - (r.left + r.width / 2);
        const dy = y - (r.top + r.height / 2);
        const d = dx * dx + (dy * 2) * (dy * 2);
        if (d < bestD) { bestD = d; best = { el: n, dx: dx }; }
    });
    const after = best.dx > 0;
    return { el: best.el, index: (+best.el.dataset.index) + (after ? 1 : 0), after: after };
}
function clearMarks() {
    document.querySelectorAll('.drop-before,.drop-after,.drop-empty').forEach((n) => n.classList.remove('drop-before', 'drop-after', 'drop-empty'));
}
function moveItem(from, idx, to, toIdx) {
    const src = getList(from);
    const it = src.splice(idx, 1)[0];
    if (from === to && idx < toIdx) toIdx--;
    if (from === 'top' && to !== 'top' && it.type === 'link') {
        // トップボタンのアイコンは名前の先頭に移す
        it.name = (it.icon ? it.icon + ' ' : '') + it.name;
        delete it.icon; delete it.type;
    } else if (from !== 'top' && to === 'top') {
        it.type = 'link'; it.icon = it.icon || '';
    }
    getList(to).splice(toIdx, 0, it);
}

document.addEventListener('dragstart', (e) => {
    const n = e.target.closest ? e.target.closest('[data-drag]') : null;
    if (!n) return;
    drag = { cont: n.dataset.cont, index: +n.dataset.index, node: n };
    n.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    const a = n.matches('a') ? n : n.querySelector('a');
    try { e.dataTransfer.setData('text/plain', a ? a.href : ''); } catch (err) {}
});
document.addEventListener('dragover', (e) => {
    if (!drag) return;
    const root = e.target.closest ? e.target.closest('[data-root]') : null;
    if (!root) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    clearMarks();
    const p = dropPos(root, e.clientX, e.clientY);
    if (p.el) p.el.classList.add(p.after ? 'drop-after' : 'drop-before');
    else root.classList.add('drop-empty');
});
document.addEventListener('drop', (e) => {
    if (!drag) return;
    const root = e.target.closest ? e.target.closest('[data-root]') : null;
    if (!root) return;
    e.preventDefault();
    const p = dropPos(root, e.clientX, e.clientY);
    moveItem(drag.cont, drag.index, root.dataset.root, p.index);
    drag = null;
    clearMarks();
    save();
    renderMain();
    if (!$('editor').hidden) buildEditor();
});
document.addEventListener('dragend', () => {
    if (drag && drag.node) drag.node.classList.remove('dragging');
    drag = null;
    clearMarks();
});

/* ===== URL追加/編集ダイアログ ===== */
let pendingFocus = null;

function changed(rebuild, focusKey) {
    save();
    renderMain();
    if (rebuild) {
        pendingFocus = focusKey || null;
        buildEditor();
    }
}
function textInput(obj, key, ph, cls) {
    return el('input', { type: 'text', class: cls, placeholder: ph, value: obj[key] || '', oninput: (e) => { obj[key] = e.target.value; changed(false); } });
}
function checkInput(obj, key, label, title) {
    const cb = el('input', { type: 'checkbox', checked: !!obj[key], onchange: (e) => { obj[key] = e.target.checked; changed(false); } });
    return el('label', { class: 'ed-chk', title: title }, cb, document.createTextNode(label));
}
function swapIn(list, i, d) {
    const j = i + d;
    if (j < 0 || j >= list.length) return;
    const t = list[i]; list[i] = list[j]; list[j] = t;
    changed(true);
}
function moveBtns(list, i, onDelete) {
    return [
        el('button', { title: '上へ/前へ', text: '▲', onclick: () => swapIn(list, i, -1) }),
        el('button', { title: '下へ/後ろへ', text: '▼', onclick: () => swapIn(list, i, 1) }),
        el('button', { class: 'del', title: '削除', text: '🗑', onclick: onDelete })
    ];
}
function itemRow(list, i, cont) {
    const it = list[i];
    const row = el('div', { class: 'ed-row' });
    if (it.type === 'break') {
        row.append(el('span', { class: 'ed-break', text: '↵ 改行' }));
    } else {
        if (cont === 'top') row.append(textInput(it, 'icon', '絵文字', 'ed-icon'));
        const n = textInput(it, 'name', '名前', 'ed-name');
        n.dataset.key = cont + ':' + i;
        row.append(n);
        row.append(textInput(it, 'url', 'URL (https://… / file:///…)', 'ed-url'));
        row.append(checkInput(it, 'popup', '小窓', '右上の小さなウィンドウで開く'));
    }
    moveBtns(list, i, () => { list.splice(i, 1); changed(true); }).forEach((b) => row.append(b));
    return row;
}
function buildEditor() {
    const body = $('editor-body');
    const st = body.scrollTop;
    body.textContent = '';
    body.append(el('p', { class: 'ed-note', text: '入力内容は自動で保存されます。メイン画面ではリンクをドラッグ&ドロップして並べ替え・移動もできます。バックアップは「設定 → JSONで書き出し」で。' }));

    // トップボタン群
    const topBox = el('div', { class: 'ed-block' });
    topBox.append(el('h3', { text: '🔝 トップボタン群' }));
    data.topLinks.forEach((it, i) => topBox.append(itemRow(data.topLinks, i, 'top')));
    topBox.append(el('div', { class: 'ed-actions' },
        el('button', { text: '＋ ボタン追加', onclick: () => {
            data.topLinks.push({ type: 'link', icon: '', name: '', url: '', popup: false });
            changed(true, 'top:' + (data.topLinks.length - 1));
        } }),
        el('button', { text: '↵ 改行を追加', onclick: () => { data.topLinks.push({ type: 'break' }); changed(true); } })
    ));
    body.append(topBox);

    // セクション
    data.sections.forEach((s, si) => {
        const box = el('div', { class: 'ed-block' });
        const head = el('div', { class: 'ed-row ed-sechead' });
        head.append(textInput(s, 'icon', '絵文字', 'ed-icon'));
        const t = textInput(s, 'title', 'セクション名', 'ed-name');
        t.dataset.key = 'sec:' + si;
        head.append(t);
        head.append(checkInput(s, 'dim', '薄色背景', 'セクションを薄い色で表示'));
        moveBtns(data.sections, si, () => {
            if (s.links.length && !confirm('「' + s.title + '」とその中の ' + s.links.length + ' 件のリンクを削除します。よろしいですか?')) return;
            data.sections.splice(si, 1);
            changed(true);
        }).forEach((b) => head.append(b));
        box.append(head);
        s.links.forEach((l, li) => box.append(itemRow(s.links, li, String(si))));
        box.append(el('div', { class: 'ed-actions' },
            el('button', { text: '＋ URL追加', onclick: () => {
                s.links.push({ name: '', url: '', popup: false });
                changed(true, si + ':' + (s.links.length - 1));
            } })
        ));
        body.append(box);
    });

/* ===== QRコード作成(別ウィンドウ) ===== */
function qrGenFactory() {
    // 標準 QR コード(ISO/IEC 18004)エンコーダ: バイトモード / UTF-8 / 型番1-40 / 誤り訂正 L,M,Q,H
    var ECC_PER_BLOCK = [
        [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
        [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
    ];
    var NUM_BLOCKS = [
        [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
        [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
        [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
        [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
    ];
    var FORMAT_BITS = [1, 0, 3, 2]; // L, M, Q, H
    var LEVELS = { L: 0, M: 1, Q: 2, H: 3 };

    function rawModules(ver) {
        var r = (16 * ver + 128) * ver + 64;
        if (ver >= 2) {
            var na = Math.floor(ver / 7) + 2;
            r -= (25 * na - 10) * na - 55;
            if (ver >= 7) r -= 36;
        }
        return r;
    }
    function dataCodewords(ver, ecl) {
        return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
    }

    // ---- Reed-Solomon (GF(256), 0x11D) ----
    function rsMul(x, y) {
        var z = 0;
        for (var i = 7; i >= 0; i--) {
            z = (z << 1) ^ ((z >>> 7) * 0x11D);
            z ^= ((y >>> i) & 1) * x;
        }
        return z;
    }
    function rsDivisor(degree) {
        var r = [], i, j;
        for (i = 0; i < degree - 1; i++) r.push(0);
        r.push(1);
        var root = 1;
        for (i = 0; i < degree; i++) {
            for (j = 0; j < r.length; j++) {
                r[j] = rsMul(r[j], root);
                if (j + 1 < r.length) r[j] ^= r[j + 1];
            }
            root = rsMul(root, 0x02);
        }
        return r;
    }
    function rsRemainder(data, divisor) {
        var r = divisor.map(function () { return 0; });
        data.forEach(function (b) {
            var f = b ^ r.shift();
            r.push(0);
            divisor.forEach(function (c, i) { r[i] ^= rsMul(c, f); });
        });
        return r;
    }

    function addEccAndInterleave(data, ver, ecl) {
        var numBlocks = NUM_BLOCKS[ecl][ver];
        var eccLen = ECC_PER_BLOCK[ecl][ver];
        var raw = Math.floor(rawModules(ver) / 8);
        var numShort = numBlocks - raw % numBlocks;
        var shortLen = Math.floor(raw / numBlocks);
        var blocks = [], div = rsDivisor(eccLen), i, k = 0;
        for (i = 0; i < numBlocks; i++) {
            var dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
            k += dat.length;
            var ecc = rsRemainder(dat, div);
            if (i < numShort) dat.push(0);
            blocks.push(dat.concat(ecc));
        }
        var result = [];
        for (i = 0; i < blocks[0].length; i++) {
            for (var j = 0; j < blocks.length; j++) {
                if (i !== shortLen - eccLen || j >= numShort) result.push(blocks[j][i]);
            }
        }
        return result;
    }

    function toUtf8(str) {
        if (typeof TextEncoder !== 'undefined') return Array.prototype.slice.call(new TextEncoder().encode(str));
        var s = unescape(encodeURIComponent(str)), out = [];
        for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
        return out;
    }

    function makeDataCodewords(bytes, ver, ecl) {
        var bits = [];
        function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
        put(4, 4);                               // バイトモード
        put(bytes.length, ver <= 9 ? 8 : 16);    // 文字数(バイト数)
        bytes.forEach(function (b) { put(b, 8); });
        var cap = dataCodewords(ver, ecl) * 8;
        put(0, Math.min(4, cap - bits.length));  // 終端
        while (bits.length % 8 !== 0) bits.push(0);
        var cw = [];
        for (var i = 0; i < bits.length; i += 8) {
            var v = 0;
            for (var j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
            cw.push(v);
        }
        for (var pad = 0xEC; cw.length < cap / 8; pad ^= 0xEC ^ 0x11) cw.push(pad);
        return cw;
    }

    function buildMatrix(codewords, ver, ecl) {
        var size = ver * 4 + 17, x, y, i;
        var mod = [], func = [];
        for (y = 0; y < size; y++) {
            mod.push(new Array(size).fill(false));
            func.push(new Array(size).fill(false));
        }
        function setF(x, y, dark) { mod[y][x] = dark; func[y][x] = true; }
        function bit(v, i) { return ((v >>> i) & 1) !== 0; }

        function drawFormat(mask) {
            var data = (FORMAT_BITS[ecl] << 3) | mask, rem = data, k;
            for (k = 0; k < 10; k++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            var bits = ((data << 10) | rem) ^ 0x5412;
            for (k = 0; k <= 5; k++) setF(8, k, bit(bits, k));
            setF(8, 7, bit(bits, 6));
            setF(8, 8, bit(bits, 7));
            setF(7, 8, bit(bits, 8));
            for (k = 9; k < 15; k++) setF(14 - k, 8, bit(bits, k));
            for (k = 0; k < 8; k++) setF(size - 1 - k, 8, bit(bits, k));
            for (k = 8; k < 15; k++) setF(8, size - 15 + k, bit(bits, k));
            setF(8, size - 8, true);
        }
        function drawVersion() {
            if (ver < 7) return;
            var rem = ver, k;
            for (k = 0; k < 12; k++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            var bits = (ver << 12) | rem;
            for (k = 0; k < 18; k++) {
                var a = size - 11 + k % 3, b = Math.floor(k / 3);
                setF(a, b, bit(bits, k));
                setF(b, a, bit(bits, k));
            }
        }
        function drawFinder(cx, cy) {
            for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
                var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = cx + dx, yy = cy + dy;
                if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
            }
        }
        function drawAlign(cx, cy) {
            for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
                setF(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
        function alignPositions() {
            if (ver === 1) return [];
            var n = Math.floor(ver / 7) + 2;
            var step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
            var res = [6];
            for (var pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
            return res;
        }

        for (i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
        drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);
        var ap = alignPositions(), n = ap.length;
        for (i = 0; i < n; i++) for (var j = 0; j < n; j++) {
            if (!((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)))
                drawAlign(ap[i], ap[j]);
        }
        drawFormat(0);
        drawVersion();

        // データ配置(ジグザグ)
        var idx = 0;
        for (var right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (var vert = 0; vert < size; vert++) {
                for (var jj = 0; jj < 2; jj++) {
                    x = right - jj;
                    var upward = ((right + 1) & 2) === 0;
                    y = upward ? size - 1 - vert : vert;
                    if (!func[y][x] && idx < codewords.length * 8) {
                        mod[y][x] = bit(codewords[idx >>> 3], 7 - (idx & 7));
                        idx++;
                    }
                }
            }
        }

        function applyMask(m) {
            for (var yy = 0; yy < size; yy++) for (var xx = 0; xx < size; xx++) {
                var inv;
                switch (m) {
                    case 0: inv = (xx + yy) % 2 === 0; break;
                    case 1: inv = yy % 2 === 0; break;
                    case 2: inv = xx % 3 === 0; break;
                    case 3: inv = (xx + yy) % 3 === 0; break;
                    case 4: inv = (Math.floor(xx / 3) + Math.floor(yy / 2)) % 2 === 0; break;
                    case 5: inv = xx * yy % 2 + xx * yy % 3 === 0; break;
                    case 6: inv = (xx * yy % 2 + xx * yy % 3) % 2 === 0; break;
                    default: inv = ((xx + yy) % 2 + xx * yy % 3) % 2 === 0;
                }
                if (!func[yy][xx] && inv) mod[yy][xx] = !mod[yy][xx];
            }
        }

        function penalty() {
            var p = 0, a, b, run, dark = 0;
            // N1: 同色連続
            for (a = 0; a < size; a++) {
                for (var dir = 0; dir < 2; dir++) {
                    run = 1;
                    for (b = 1; b < size; b++) {
                        var cur = dir ? mod[b][a] : mod[a][b];
                        var prev = dir ? mod[b - 1][a] : mod[a][b - 1];
                        if (cur === prev) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
                        else run = 1;
                    }
                }
            }
            // N2: 2x2 ブロック
            for (a = 0; a < size - 1; a++) for (b = 0; b < size - 1; b++) {
                var c = mod[a][b];
                if (c === mod[a][b + 1] && c === mod[a + 1][b] && c === mod[a + 1][b + 1]) p += 3;
            }
            // N3: 1:1:3:1:1 パターン
            var pat1 = [true, false, true, true, true, false, true, false, false, false, false];
            var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
            for (a = 0; a < size; a++) for (b = 0; b <= size - 11; b++) {
                var m1 = true, m2 = true, m3 = true, m4 = true;
                for (var t = 0; t < 11; t++) {
                    if (mod[a][b + t] !== pat1[t]) m1 = false;
                    if (mod[a][b + t] !== pat2[t]) m2 = false;
                    if (mod[b + t][a] !== pat1[t]) m3 = false;
                    if (mod[b + t][a] !== pat2[t]) m4 = false;
                }
                p += 40 * ((m1 ? 1 : 0) + (m2 ? 1 : 0) + (m3 ? 1 : 0) + (m4 ? 1 : 0));
            }
            // N4: 白黒の比率
            for (a = 0; a < size; a++) for (b = 0; b < size; b++) if (mod[a][b]) dark++;
            var total = size * size;
            p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
            return p;
        }

        var best = 0, bestP = Infinity;
        for (var m = 0; m < 8; m++) {
            applyMask(m);
            drawFormat(m);
            var pen = penalty();
            if (pen < bestP) { bestP = pen; best = m; }
            applyMask(m); // 元に戻す
        }
        applyMask(best);
        drawFormat(best);
        return { size: size, modules: mod, mask: best };
    }

    // text: 文字列, level: 'L'|'M'|'Q'|'H'(優先する誤り訂正レベル。入らなければ自動で下げる)
    function encode(text, level) {
        var bytes = toUtf8(text);
        var order = ['H', 'Q', 'M', 'L'];
        var start = order.indexOf(level || 'M');
        for (var li = start; li < order.length; li++) {
            var ecl = LEVELS[order[li]];
            for (var ver = 1; ver <= 40; ver++) {
                var needBits = 4 + (ver <= 9 ? 8 : 16) + bytes.length * 8;
                if (needBits <= dataCodewords(ver, ecl) * 8) {
                    var cw = addEccAndInterleave(makeDataCodewords(bytes, ver, ecl), ver, ecl);
                    var r = buildMatrix(cw, ver, ecl);
                    r.version = ver; r.level = order[li]; r.byteLength = bytes.length;
                    return r;
                }
            }
        }
        return null; // 長すぎる
    }

    return { encode: encode, capacity: function (ver, level) { return dataCodewords(ver, LEVELS[level]); } };
}

          <label for="level">誤り訂正レベル</label>
          <select id="level">
            <option value="L">L（低）</option>
            <option value="M" selected>M（標準）</option>
            <option value="Q">Q（やや高）</option>
            <option value="H">H（高）</option>
          </select>
        </div>
        <div>
          <label for="dotShape">ドットの形状</label>
          <select id="dotShape">
            <option value="square" selected>角型　■</option>
            <option value="circle">丸型　●</option>
            <option value="dot">点型　・</option>
          </select>
        </div>
        <button id="clear" type="button">クリア</button>
      </div>
    </section>
    <section class="stage" aria-live="polite">
      <div id="frame">
        <p id="empty">文章を入力すると、ここにQRコードが表示されます。</p>
        <canvas id="canvas" role="img" aria-label="作成したQRコード"></canvas>
      </div>
      <div id="info"></div>
      <button id="download" type="button" disabled>PNG画像を保存</button>
    </section>
  </div>
  <p class="hint">日本語や改行もそのまま入力できます。「PNG画像を保存」ボタンから画像として保存できます。</p>
</main>
<script>
${qrGenFactory.toString()}

(function () {
  var QRGen = qrGenFactory();
  var text = document.getElementById('text');
  var level = document.getElementById('level');
  var dotShape = document.getElementById('dotShape');
  var download = document.getElementById('download');
  var frame = document.getElementById('frame');
  var empty = document.getElementById('empty');
  var canvas = document.getElementById('canvas');
  var info = document.getElementById('info');

  function reset(msg, isError) {
    canvas.style.display = 'none';
    download.disabled = true;
    empty.style.display = '';
    frame.classList.remove('has-qr');
    info.className = isError ? 'error' : '';
    info.textContent = msg || '';
  }

  function render() {
    var val = text.value;
    if (val === '') { reset(''); return; }
    var qr = QRGen.encode(val, level.value);
    if (!qr) { reset('文章が長すぎてQRコードにできません。短くしてください。', true); return; }
    // 規格どおり周囲に4マスの余白を付け、1マスを整数ピクセルで描いてにじみを防ぐ
    var quiet = 4, total = qr.size + quiet * 2;
    var avail = Math.min(frame.clientWidth || 420, 460);
    var scale = Math.max(2, Math.floor(avail / total));
    var px = total * scale;
    canvas.width = px; canvas.height = px;
    canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000000';
    var shape = dotShape.value;
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (!qr.modules[y][x]) continue;
        var dx = (x + quiet) * scale;
        var dy = (y + quiet) * scale;
        var inFinder = (x < 7 && y < 7) || (x >= qr.size - 7 && y < 7) || (x < 7 && y >= qr.size - 7);
        if ((shape === 'circle' || shape === 'dot') && !inFinder) {
          ctx.beginPath();
          var radius = shape === 'circle' ? scale * 0.46 : scale * 0.32;
          ctx.arc(dx + scale / 2, dy + scale / 2, radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(dx, dy, scale, scale);
        }
      }
    }
    empty.style.display = 'none';
    canvas.style.display = 'block';
    download.disabled = false;
    frame.classList.add('has-qr');
    info.className = '';
    var note = qr.level !== level.value ? '（文章が長いため' + qr.level + 'に下げました）' : '';
    info.textContent = '型番 ' + qr.version + ' ／ 誤り訂正 ' + qr.level + ' ／ ' + qr.byteLength + ' バイト' + note;
  }

  text.addEventListener('input', render);
  level.addEventListener('change', render);
  dotShape.addEventListener('change', render);
  download.addEventListener('click', function () {
    if (download.disabled) return;
    var link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
  window.addEventListener('resize', function () { if (text.value !== '') render(); });
  document.getElementById('clear').addEventListener('click', function () {
    text.value = ''; render(); text.focus();
  });
})();
<\/script>
</body>

    qrWindow.document.close();

</script>
