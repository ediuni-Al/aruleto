<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Japanese Text Editor + Offline QR Generator</title>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --bg-subtle: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --text-bright: #f0f6fc;
            --accent: #238636;
            --accent-hover: #2ea043;
            --blue-accent: #58a6ff;
            --blue-hover: #388bfd;
            --danger: #da3633;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg-main: #f6f8fa;
            --bg-panel: #ffffff;
            --bg-subtle: #f0f2f5;
            --border-color: #d0d7de;
            --text-main: #1f2328;
            --text-muted: #656d76;
            --text-bright: #000000;
            --accent: #1f883d;
            --accent-hover: #1a7f37;
            --blue-accent: #0969da;
            --blue-hover: #0860ca;
            --danger: #cf222e;
            --shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Header */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-bright);
        }

        .badge {
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            background-color: rgba(56, 139, 253, 0.15);
            color: var(--blue-accent);
            border: 1px solid rgba(56, 139, 253, 0.4);
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.825rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn:hover {
            background-color: var(--border-color);
            color: var(--text-bright);
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        .btn-qr {
            background-color: var(--blue-accent);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-qr:hover {
            background-color: var(--blue-hover);
            color: #ffffff;
        }

        .divider {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
            margin: 0 0.2rem;
        }

        /* Find & Replace Bar */
        .find-bar {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .find-bar.hidden {
            display: none;
        }

        .input-field {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--blue-accent);
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-main);
        }

        .line-numbers {
            width: 50px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.6;
            padding: 0.75rem 0.5rem;
            text-align: right;
            user-select: none;
            overflow: hidden;
            flex-shrink: 0;
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        textarea.editor {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background-color: transparent;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.6;
            padding: 0.75rem 1rem;
            resize: none;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
        }

        /* Status Bar */
        footer.status-bar {
            height: 28px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .status-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* QR Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 380px;
            max-width: 90vw;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-subtle);
        }

        .modal-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .qr-canvas-wrapper {
            background: #ffffff;
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#qr-canvas {
            display: block;
            image-rendering: pixelated;
            max-width: 100%;
        }

        .qr-info {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .qr-text-preview {
            max-height: 60px;
            width: 100%;
            overflow-y: auto;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            border-radius: 4px;
            word-break: break-all;
            color: var(--text-muted);
        }

        .modal-footer {
            padding: 0.75rem 1rem;
            background-color: var(--bg-subtle);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="light">

    <!-- Header Toolbar -->
    <header>
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            <span>テキストエディタ</span>
            <span class="badge">完全ローカル/QR付</span>
        </div>

        <div class="toolbar">
            <button class="btn" id="btn-open" title="ファイルを開く (Ctrl+O)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                開く
            </button>
            <input type="file" id="file-input" class="hidden" accept=".txt,.md,.json,.js,.css,.html,.csv,*">

            <button class="btn btn-primary" id="btn-save" title="ファイルを保存 (Ctrl+S)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline></svg>
                保存
            </button>

            <div class="divider"></div>

            <button class="btn" id="btn-undo" title="元に戻す (Ctrl+Z)">元に戻す</button>
            <button class="btn" id="btn-redo" title="やり直し (Ctrl+Y)">やり直し</button>

            <div class="divider"></div>

            <button class="btn" id="btn-copy" title="選択部分をコピー">コピー</button>
            <button class="btn" id="btn-cut" title="選択部分を切り取り">切り取り</button>
            <button class="btn" id="btn-paste" title="貼り付け">貼り付け</button>

            <div class="divider"></div>

            <button class="btn" id="btn-find-toggle" title="検索・置換 (Ctrl+F)">検索・置換</button>

            <div class="divider"></div>

            <button class="btn btn-qr" id="btn-qr-generate" title="選択部分をQRコード化 (Ctrl+Q)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                QR生成
            </button>

            <button class="btn" id="btn-theme-toggle" title="ダーク/ライトモード切替">☀️</button>
        </div>
    </header>

    <!-- Find & Replace Bar -->
    <div class="find-bar hidden" id="find-bar">
        <span>検索:</span>
        <input type="text" id="find-input" class="input-field" placeholder="検索文字列">
        <span>置換:</span>
        <input type="text" id="replace-input" class="input-field" placeholder="置換文字列">
        <button class="btn" id="btn-find-next">次へ</button>
        <button class="btn" id="btn-replace">置換</button>
        <button class="btn" id="btn-replace-all">すべて置換</button>
        <button class="btn" id="btn-find-close" style="margin-left: auto;">✕</button>
    </div>

    <!-- Editor Workspace -->
    <main class="workspace" id="drop-zone">
        <div class="line-numbers" id="line-numbers">1</div>
        <div class="editor-container">
            <textarea class="editor" id="editor" spellcheck="false" placeholder="ここに日本語テキストを入力、またはファイルをドラッグ＆ドロップしてください..."></textarea>
        </div>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar">
        <div class="status-section">
            <span id="stat-lines">1 行</span>
            <span id="stat-chars">0 文字</span>
            <span id="stat-selected">選択: 0 文字</span>
        </div>
        <div class="status-section">
            <span>エンコード: UTF-8</span>
            <span>改行: LF/CRLF</span>
        </div>
    </footer>

    <!-- QR Code Modal Dialog -->
    <div class="modal-overlay" id="qr-modal">
        <div class="modal">
            <div class="modal-header">
                <span>QRコード表示 (ローカル作成)</span>
                <button class="btn" id="qr-modal-close">✕</button>
            </div>
            <div class="modal-body">
                <div class="qr-canvas-wrapper">
                    <canvas id="qr-canvas"></canvas>
                </div>
                <div class="qr-info" id="qr-info"></div>
                <div class="qr-text-preview" id="qr-text-preview"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="btn-qr-download">画像保存 (PNG)</button>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        (function() {
            'use strict';

            // =========================================================================
            // QR Code Generator Engine (ISO/IEC 18004 準拠: UTF-8 バイトモード / 型番1-40 / 誤り訂正 L,M,Q,H)
            // QRコード作成.html のエンコーダを移植
            // =========================================================================
            function qrGenFactory() {
                // 標準 QR コード(ISO/IEC 18004)エンコーダ: バイトモード / UTF-8 / 型番1-40 / 誤り訂正 L,M,Q,H
                var ECC_PER_BLOCK = [
                    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
                    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
                    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
                    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
                ];
                var NUM_BLOCKS = [
                    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
                    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
                    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
                    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
                ];
                var FORMAT_BITS = [1, 0, 3, 2]; // L, M, Q, H
                var LEVELS = { L: 0, M: 1, Q: 2, H: 3 };

                function rawModules(ver) {
                    var r = (16 * ver + 128) * ver + 64;
                    if (ver >= 2) {
                        var na = Math.floor(ver / 7) + 2;
                        r -= (25 * na - 10) * na - 55;
                        if (ver >= 7) r -= 36;
                    }
                    return r;
                }
                function dataCodewords(ver, ecl) {
                    return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
                }

                // ---- Reed-Solomon (GF(256), 0x11D) ----
                function rsMul(x, y) {
                    var z = 0;
                    for (var i = 7; i >= 0; i--) {
                        z = (z << 1) ^ ((z >>> 7) * 0x11D);
                        z ^= ((y >>> i) & 1) * x;
                    }
                    return z;
                }
                function rsDivisor(degree) {
                    var r = [], i, j;
                    for (i = 0; i < degree - 1; i++) r.push(0);
                    r.push(1);
                    var root = 1;
                    for (i = 0; i < degree; i++) {
                        for (j = 0; j < r.length; j++) {
                            r[j] = rsMul(r[j], root);
                            if (j + 1 < r.length) r[j] ^= r[j + 1];
                        }
                        root = rsMul(root, 0x02);
                    }
                    return r;
                }
                function rsRemainder(data, divisor) {
                    var r = divisor.map(function () { return 0; });
                    data.forEach(function (b) {
                        var f = b ^ r.shift();
                        r.push(0);
                        divisor.forEach(function (c, i) { r[i] ^= rsMul(c, f); });
                    });
                    return r;
                }

                function addEccAndInterleave(data, ver, ecl) {
                    var numBlocks = NUM_BLOCKS[ecl][ver];
                    var eccLen = ECC_PER_BLOCK[ecl][ver];
                    var raw = Math.floor(rawModules(ver) / 8);
                    var numShort = numBlocks - raw % numBlocks;
                    var shortLen = Math.floor(raw / numBlocks);
                    var blocks = [], div = rsDivisor(eccLen), i, k = 0;
                    for (i = 0; i < numBlocks; i++) {
                        var dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
                        k += dat.length;
                        var ecc = rsRemainder(dat, div);
                        if (i < numShort) dat.push(0);
                        blocks.push(dat.concat(ecc));
                    }
                    var result = [];
                    for (i = 0; i < blocks[0].length; i++) {
                        for (var j = 0; j < blocks.length; j++) {
                            if (i !== shortLen - eccLen || j >= numShort) result.push(blocks[j][i]);
                        }
                    }
                    return result;
                }

                function toUtf8(str) {
                    if (typeof TextEncoder !== 'undefined') return Array.prototype.slice.call(new TextEncoder().encode(str));
                    var s = unescape(encodeURIComponent(str)), out = [];
                    for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
                    return out;
                }

                function makeDataCodewords(bytes, ver, ecl) {
                    var bits = [];
                    function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
                    put(4, 4);                               // バイトモード
                    put(bytes.length, ver <= 9 ? 8 : 16);    // 文字数(バイト数)
                    bytes.forEach(function (b) { put(b, 8); });
                    var cap = dataCodewords(ver, ecl) * 8;
                    put(0, Math.min(4, cap - bits.length));  // 終端
                    while (bits.length % 8 !== 0) bits.push(0);
                    var cw = [];
                    for (var i = 0; i < bits.length; i += 8) {
                        var v = 0;
                        for (var j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
                        cw.push(v);
                    }
                    for (var pad = 0xEC; cw.length < cap / 8; pad ^= 0xEC ^ 0x11) cw.push(pad);
                    return cw;
                }

                function buildMatrix(codewords, ver, ecl) {
                    var size = ver * 4 + 17, x, y, i;
                    var mod = [], func = [];
                    for (y = 0; y < size; y++) {
                        mod.push(new Array(size).fill(false));
                        func.push(new Array(size).fill(false));
                    }
                    function setF(x, y, dark) { mod[y][x] = dark; func[y][x] = true; }
                    function bit(v, i) { return ((v >>> i) & 1) !== 0; }

                    function drawFormat(mask) {
                        var data = (FORMAT_BITS[ecl] << 3) | mask, rem = data, k;
                        for (k = 0; k < 10; k++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
                        var bits = ((data << 10) | rem) ^ 0x5412;
                        for (k = 0; k <= 5; k++) setF(8, k, bit(bits, k));
                        setF(8, 7, bit(bits, 6));
                        setF(8, 8, bit(bits, 7));
                        setF(7, 8, bit(bits, 8));
                        for (k = 9; k < 15; k++) setF(14 - k, 8, bit(bits, k));
                        for (k = 0; k < 8; k++) setF(size - 1 - k, 8, bit(bits, k));
                        for (k = 8; k < 15; k++) setF(8, size - 15 + k, bit(bits, k));
                        setF(8, size - 8, true);
                    }
                    function drawVersion() {
                        if (ver < 7) return;
                        var rem = ver, k;
                        for (k = 0; k < 12; k++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
                        var bits = (ver << 12) | rem;
                        for (k = 0; k < 18; k++) {
                            var a = size - 11 + k % 3, b = Math.floor(k / 3);
                            setF(a, b, bit(bits, k));
                            setF(b, a, bit(bits, k));
                        }
                    }
                    function drawFinder(cx, cy) {
                        for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
                            var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = cx + dx, yy = cy + dy;
                            if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
                        }
                    }
                    function drawAlign(cx, cy) {
                        for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
                            setF(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
                    }
                    function alignPositions() {
                        if (ver === 1) return [];
                        var n = Math.floor(ver / 7) + 2;
                        var step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
                        var res = [6];
                        for (var pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
                        return res;
                    }

                    for (i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
                    drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);
                    var ap = alignPositions(), n = ap.length;
                    for (i = 0; i < n; i++) for (var j = 0; j < n; j++) {
                        if (!((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)))
                            drawAlign(ap[i], ap[j]);
                    }
                    drawFormat(0);
                    drawVersion();

                    // データ配置(ジグザグ)
                    var idx = 0;
                    for (var right = size - 1; right >= 1; right -= 2) {
                        if (right === 6) right = 5;
                        for (var vert = 0; vert < size; vert++) {
                            for (var jj = 0; jj < 2; jj++) {
                                x = right - jj;
                                var upward = ((right + 1) & 2) === 0;
                                y = upward ? size - 1 - vert : vert;
                                if (!func[y][x] && idx < codewords.length * 8) {
                                    mod[y][x] = bit(codewords[idx >>> 3], 7 - (idx & 7));
                                    idx++;
                                }
                            }
                        }
                    }

                    function applyMask(m) {
                        for (var yy = 0; yy < size; yy++) for (var xx = 0; xx < size; xx++) {
                            var inv;
                            switch (m) {
                                case 0: inv = (xx + yy) % 2 === 0; break;
                                case 1: inv = yy % 2 === 0; break;
                                case 2: inv = xx % 3 === 0; break;
                                case 3: inv = (xx + yy) % 3 === 0; break;
                                case 4: inv = (Math.floor(xx / 3) + Math.floor(yy / 2)) % 2 === 0; break;
                                case 5: inv = xx * yy % 2 + xx * yy % 3 === 0; break;
                                case 6: inv = (xx * yy % 2 + xx * yy % 3) % 2 === 0; break;
                                default: inv = ((xx + yy) % 2 + xx * yy % 3) % 2 === 0;
                            }
                            if (!func[yy][xx] && inv) mod[yy][xx] = !mod[yy][xx];
                        }
                    }

                    function penalty() {
                        var p = 0, a, b, run, dark = 0;
                        // N1: 同色連続
                        for (a = 0; a < size; a++) {
                            for (var dir = 0; dir < 2; dir++) {
                                run = 1;
                                for (b = 1; b < size; b++) {
                                    var cur = dir ? mod[b][a] : mod[a][b];
                                    var prev = dir ? mod[b - 1][a] : mod[a][b - 1];
                                    if (cur === prev) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
                                    else run = 1;
                                }
                            }
                        }
                        // N2: 2x2 ブロック
                        for (a = 0; a < size - 1; a++) for (b = 0; b < size - 1; b++) {
                            var c = mod[a][b];
                            if (c === mod[a][b + 1] && c === mod[a + 1][b] && c === mod[a + 1][b + 1]) p += 3;
                        }
                        // N3: 1:1:3:1:1 パターン
                        var pat1 = [true, false, true, true, true, false, true, false, false, false, false];
                        var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
                        for (a = 0; a < size; a++) for (b = 0; b <= size - 11; b++) {
                            var m1 = true, m2 = true, m3 = true, m4 = true;
                            for (var t = 0; t < 11; t++) {
                                if (mod[a][b + t] !== pat1[t]) m1 = false;
                                if (mod[a][b + t] !== pat2[t]) m2 = false;
                                if (mod[b + t][a] !== pat1[t]) m3 = false;
                                if (mod[b + t][a] !== pat2[t]) m4 = false;
                            }
                            p += 40 * ((m1 ? 1 : 0) + (m2 ? 1 : 0) + (m3 ? 1 : 0) + (m4 ? 1 : 0));
                        }
                        // N4: 白黒の比率
                        for (a = 0; a < size; a++) for (b = 0; b < size; b++) if (mod[a][b]) dark++;
                        var total = size * size;
                        p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
                        return p;
                    }

                    var best = 0, bestP = Infinity;
                    for (var m = 0; m < 8; m++) {
                        applyMask(m);
                        drawFormat(m);
                        var pen = penalty();
                        if (pen < bestP) { bestP = pen; best = m; }
                        applyMask(m); // 元に戻す
                    }
                    applyMask(best);
                    drawFormat(best);
                    return { size: size, modules: mod, mask: best };
                }

                // text: 文字列, level: 'L'|'M'|'Q'|'H'(優先する誤り訂正レベル。入らなければ自動で下げる)
                function encode(text, level) {
                    var bytes = toUtf8(text);
                    var order = ['H', 'Q', 'M', 'L'];
                    var start = order.indexOf(level || 'M');
                    for (var li = start; li < order.length; li++) {
                        var ecl = LEVELS[order[li]];
                        for (var ver = 1; ver <= 40; ver++) {
                            var needBits = 4 + (ver <= 9 ? 8 : 16) + bytes.length * 8;
                            if (needBits <= dataCodewords(ver, ecl) * 8) {
                                var cw = addEccAndInterleave(makeDataCodewords(bytes, ver, ecl), ver, ecl);
                                var r = buildMatrix(cw, ver, ecl);
                                r.version = ver; r.level = order[li]; r.byteLength = bytes.length;
                                return r;
                            }
                        }
                    }
                    return null; // 長すぎる
                }

                return { encode: encode, capacity: function (ver, level) { return dataCodewords(ver, LEVELS[level]); } };
            }

            const QRGen = qrGenFactory();
            const QRCodeEngine = {
                // 描画に成功すれば情報オブジェクト、長すぎる場合は null を返す
                renderToCanvas: function(canvas, text, level) {
                    const qr = QRGen.encode(text, level || 'M');
                    if (!qr) return null;
                    const quiet = 4; // 規格どおりの余白(4マス)
                    const total = qr.size + quiet * 2;
                    const maxPx = 300;
                    const scale = Math.max(2, Math.floor(maxPx / total)); // 整数ピクセルでにじみ防止
                    const px = total * scale;
                    canvas.width = px;
                    canvas.height = px;
                    canvas.style.width = px + 'px';
                    canvas.style.height = px + 'px';
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, px, px);
                    ctx.fillStyle = '#000000';
                    for (let y = 0; y < qr.size; y++) {
                        for (let x = 0; x < qr.size; x++) {
                            if (qr.modules[y][x]) {
                                ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
                            }
                        }
                    }
                    return qr;
                }
            };

            // =========================================================================
            // Editor Logic & DOM Binding
            // =========================================================================
            const editor = document.getElementById('editor');
            const lineNumbers = document.getElementById('line-numbers');
            const fileInput = document.getElementById('file-input');
            const dropZone = document.getElementById('drop-zone');

            // Status Bar Elements
            const statLines = document.getElementById('stat-lines');
            const statChars = document.getElementById('stat-chars');
            const statSelected = document.getElementById('stat-selected');

            // Find Bar
            const findBar = document.getElementById('find-bar');
            const findInput = document.getElementById('find-input');
            const replaceInput = document.getElementById('replace-input');

            // QR Modal
            const qrModal = document.getElementById('qr-modal');
            const qrCanvas = document.getElementById('qr-canvas');
            const qrTextPreview = document.getElementById('qr-text-preview');
            const qrInfo = document.getElementById('qr-info');

            // Update Line Numbers & Stats
            function updateEditorStats() {
                const text = editor.value;
                const lines = text.split('\n');
                
                // Sync line numbers
                let lineNumHtml = '';
                for (let i = 1; i <= lines.length; i++) {
                    lineNumHtml += i + '<br>';
                }
                lineNumbers.innerHTML = lineNumHtml;

                // Update Status text
                statLines.textContent = `${lines.length} 行`;
                statChars.textContent = `${text.length} 文字`;

                const selLen = editor.selectionEnd - editor.selectionStart;
                statSelected.textContent = `選択: ${selLen} 文字`;
            }

            // Sync Scroll between textarea and line numbers
            editor.addEventListener('scroll', () => {
                lineNumbers.scrollTop = editor.scrollTop;
            });

            editor.addEventListener('input', updateEditorStats);
            editor.addEventListener('keyup', updateEditorStats);
            editor.addEventListener('click', updateEditorStats);
            editor.addEventListener('select', updateEditorStats);

            // Tab Key Indentation
            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;
                    editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                    editor.selectionStart = editor.selectionEnd = start + 4;
                    updateEditorStats();
                }
            });

            // File Operations (Open / Save)
            document.getElementById('btn-open').onclick = () => fileInput.click();
            
            // 文字コード自動判定つきのファイル読み込み (UTF-8 / UTF-16 / Shift_JIS / EUC-JP)
            function decodeBuffer(buf) {
                const u8 = new Uint8Array(buf);
                // BOM判定
                if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
                    return new TextDecoder('utf-8').decode(u8.subarray(3));
                }
                if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
                if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
                // 厳密にUTF-8として読めるか → だめなら日本語の旧文字コードを試す
                const candidates = ['utf-8', 'shift_jis', 'euc-jp'];
                for (const enc of candidates) {
                    try {
                        return new TextDecoder(enc, { fatal: true }).decode(u8);
                    } catch (err) { /* 次の候補へ */ }
                }
                return new TextDecoder('utf-8').decode(u8);
            }

            function loadFile(file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    editor.value = decodeBuffer(evt.target.result);
                    updateEditorStats();
                };
                reader.readAsArrayBuffer(file);
            }

            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                loadFile(file);
                fileInput.value = '';
            };

            document.getElementById('btn-save').onclick = () => {
                const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'document.txt';
                a.click();
                URL.revokeObjectURL(a.href);
            };

            // Drag & Drop File Loading
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.opacity = '0.7';
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.style.opacity = '1';
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.opacity = '1';
                if (e.dataTransfer.files.length > 0) {
                    loadFile(e.dataTransfer.files[0]);
                }
            });

            // Edit Actions
            document.getElementById('btn-undo').onclick = () => document.execCommand('undo');
            document.getElementById('btn-redo').onclick = () => document.execCommand('redo');
            document.getElementById('btn-copy').onclick = () => {
                editor.focus();
                document.execCommand('copy');
            };
            document.getElementById('btn-cut').onclick = () => {
                editor.focus();
                document.execCommand('cut');
            };
            document.getElementById('btn-paste').onclick = async () => {
                editor.focus();
                if (navigator.clipboard && navigator.clipboard.readText) {
                    try {
                        const text = await navigator.clipboard.readText();
                        const start = editor.selectionStart;
                        const end = editor.selectionEnd;
                        editor.value = editor.value.substring(0, start) + text + editor.value.substring(end);
                        editor.selectionStart = editor.selectionEnd = start + text.length;
                        updateEditorStats();
                    } catch (err) {
                        document.execCommand('paste');
                    }
                } else {
                    document.execCommand('paste');
                }
            };

            // Find and Replace Logic
            document.getElementById('btn-find-toggle').onclick = () => {
                findBar.classList.toggle('hidden');
                if (!findBar.classList.contains('hidden')) findInput.focus();
            };

            document.getElementById('btn-find-close').onclick = () => findBar.classList.add('hidden');

            document.getElementById('btn-find-next').onclick = () => {
                const query = findInput.value;
                if (!query) return;
                const text = editor.value;
                const startPos = editor.selectionEnd;
                let index = text.indexOf(query, startPos);
                if (index === -1) index = text.indexOf(query, 0); // Loop search

                if (index !== -1) {
                    editor.focus();
                    editor.setSelectionRange(index, index + query.length);
                    updateEditorStats();
                }
            };

            document.getElementById('btn-replace').onclick = () => {
                const query = findInput.value;
                const replaceText = replaceInput.value;
                if (!query) return;

                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);

                if (selectedText === query) {
                    editor.value = editor.value.substring(0, start) + replaceText + editor.value.substring(end);
                    editor.selectionStart = editor.selectionEnd = start + replaceText.length;
                    updateEditorStats();
                }
                document.getElementById('btn-find-next').click();
            };

            document.getElementById('btn-replace-all').onclick = () => {
                const query = findInput.value;
                const replaceText = replaceInput.value;
                if (!query) return;
                editor.value = editor.value.split(query).join(replaceText);
                updateEditorStats();
            };

            // QR Code Generation Trigger
            function triggerQRGeneration() {
                const selStart = editor.selectionStart;
                const selEnd = editor.selectionEnd;
                let textToEncode = editor.value.substring(selStart, selEnd);

                // Default to full text if nothing is selected
                if (!textToEncode) {
                    textToEncode = editor.value;
                }

                if (!textToEncode.trim()) {
                    alert('QRコード化するテキストを入力してください。');
                    return;
                }

                const qr = QRCodeEngine.renderToCanvas(qrCanvas, textToEncode, 'M');
                if (!qr) {
                    alert('文章が長すぎてQRコードにできません。選択範囲を短くしてください。');
                    return;
                }
                const note = qr.level !== 'M' ? '（文章が長いため誤り訂正を' + qr.level + 'に下げました）' : '';
                qrInfo.textContent = '型番 ' + qr.version + ' ／ 誤り訂正 ' + qr.level + ' ／ ' + qr.byteLength + ' バイト' + note;
                qrTextPreview.textContent = textToEncode;
                qrModal.classList.add('active');
            }

            document.getElementById('btn-qr-generate').onclick = triggerQRGeneration;
            document.getElementById('qr-modal-close').onclick = () => qrModal.classList.remove('active');

            document.getElementById('btn-qr-download').onclick = () => {
                const a = document.createElement('a');
                a.href = qrCanvas.toDataURL('image/png');
                a.download = 'qrcode.png';
                a.click();
            };

            // Theme Switcher Toggle
            const themeBtn = document.getElementById('btn-theme-toggle');
            themeBtn.onclick = () => {
                const isDark = document.body.getAttribute('data-theme') !== 'light';
                if (isDark) {
                    document.body.setAttribute('data-theme', 'light');
                    themeBtn.textContent = '☀️';
                } else {
                    document.body.removeAttribute('data-theme');
                    themeBtn.textContent = '🌙';
                }
            };

            // Keyboard Shortcuts Handler
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    if (e.key === 's') {
                        e.preventDefault();
                        document.getElementById('btn-save').click();
                    } else if (e.key === 'o') {
                        e.preventDefault();
                        document.getElementById('btn-open').click();
                    } else if (e.key === 'q') {
                        e.preventDefault();
                        triggerQRGeneration();
                    } else if (e.key === 'f') {
                        e.preventDefault();
                        findBar.classList.remove('hidden');
                        findInput.focus();
                    }
                }
            });

            // Initialize editor on startup
            updateEditorStats();
        })();
    </script>
</body>
</html>
