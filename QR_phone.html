<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QRコード 読み取り＆作成</title>
<style>
:root {
  --bg: #f4f7f9; --surface: #ffffff; --ink: #14202b; --muted: #5d6b78;
  --line: #cdd8e0; --accent: #0b6fa4; --accent-ink: #ffffff; --error: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171d; --surface: #18222b; --ink: #e6edf2; --muted: #93a3b1;
    --line: #2c3a46; --accent: #5bb6e6; --accent-ink: #08202e; --error: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171d; --surface: #18222b; --ink: #e6edf2; --muted: #93a3b1;
  --line: #2c3a46; --accent: #5bb6e6; --accent-ink: #08202e; --error: #ff8a80;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 600px; margin: 0 auto; padding: 16px 16px 40px; }

/* Tab Switcher */
.tabs {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  padding: 12px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 1rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}
.tab-btn.active {
  background: var(--accent);
  color: var(--accent-ink);
}

.mode-section { display: none; }
.mode-section.active { display: block; }

/* Layout & Controls */
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
textarea {
  width: 100%; min-height: 120px; resize: vertical; padding: 12px;
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 12px; align-items: end; margin-top: 12px; flex-wrap: wrap; }
.row > div { flex: 1 1 130px; }
select {
  width: 100%; padding: 10px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
button.action-btn {
  padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 8px;
  touch-action: manipulation;
}
button.action-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
button.action-btn:disabled { opacity: .45; cursor: not-allowed; }
button.primary-btn {
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
}
#download { margin-top: 16px; width: 100%; }

.stage { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
#frame {
  width: 100%; min-height: 260px; display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 16px;
  overflow: hidden; position: relative;
}
#frame.has-qr { border-style: solid; background: #ffffff; padding: 0; }
#empty { color: var(--muted); font-size: .9rem; text-align: center; margin: 0; }
canvas { display: none; image-rendering: pixelated; max-width: 100%; height: auto !important; }
#info { margin-top: 10px; font-size: .85rem; color: var(--muted); min-height: 1.4em; text-align: center; }
#info.error { color: var(--error); }
.hint { margin: 16px 0 0; font-size: .8rem; color: var(--muted); text-align: center; }

/* Camera & Scanner View */
.scanner-container {
  width: 100%;
  position: relative;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.scan-guide {
  position: absolute;
  width: 65%;
  height: 65%;
  border: 2px solid rgba(255, 255, 255, 0.6);
  border-radius: 16px;
  box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
  pointer-events: none;
}
.result-card {
  margin-top: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  display: none;
}
.result-card.active { display: block; }
.result-text {
  word-break: break-all;
  font-size: 0.95rem;
  margin-bottom: 12px;
  white-space: pre-wrap;
  max-height: 150px;
  overflow-y: auto;
}
.file-input-wrapper {
  margin-top: 12px;
  text-align: center;
}
input[type="file"] { display: none; }
</style>
</head>
<body>
<main>
  <!-- タブ切り替え -->
  <div class="tabs" role="tablist">
    <button class="tab-btn active" id="tab-read" role="tab" aria-selected="true">読み取り</button>
    <button class="tab-btn" id="tab-create" role="tab" aria-selected="false">作成</button>
  </div>

  <!-- 1. 読み取りモード -->
  <section id="mode-read" class="mode-section active" role="tabpanel">
    <div class="scanner-container">
      <video id="video" playsinline id="preview"></video>
      <div class="scan-guide"></div>
    </div>
    
    <div class="file-input-wrapper">
      <label for="file-input" class="action-btn" style="display:inline-block; padding:8px 16px; cursor:pointer;">
        📷 画像ファイルから読み取る
      </label>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div id="read-result" class="result-card">
      <label>読み取り結果</label>
      <div id="result-text" class="result-text"></div>
      <div class="row" style="margin-top: 0;">
        <button id="btn-copy" class="action-btn" type="button">コピー</button>
        <button id="btn-open" class="primary-btn" type="button" style="display:none;">Webページを開く</button>
      </div>
    </div>
  </section>

  <!-- 2. 作成モード -->
  <section id="mode-create" class="mode-section" role="tabpanel">
    <label for="text">QRコードにする文章やURL</label>
    <textarea id="text" placeholder="ここに文章やURLを貼り付けてください"></textarea>
    <div class="row">
      <div>
        <label for="level">誤り訂正レベル</label>
        <select id="level">
          <option value="L">L（低）</option>
          <option value="M" selected>M（標準）</option>
          <option value="Q">Q（やや高）</option>
          <option value="H">H（高）</option>
        </select>
      </div>
      <div>
        <label for="dotShape">ドットの形状</label>
        <select id="dotShape">
          <option value="square" selected>角型 ■</option>
          <option value="circle">丸型 ●</option>
          <option value="dot">点型 ・</option>
        </select>
      </div>
      <button id="clear" class="action-btn" type="button">クリア</button>
    </div>

    <div class="stage" aria-live="polite">
      <div id="frame">
        <p id="empty">文章を入力すると、ここにQRコードが表示されます。</p>
        <canvas id="canvas" role="img" aria-label="作成したQRコード"></canvas>
      </div>
      <div id="info"></div>
      <button id="download" class="action-btn" type="button" disabled>PNG画像を保存</button>
    </div>
    <p class="hint">日本語や改行もそのまま入力できます。「PNG画像を保存」ボタンから画像として保存できます。</p>
  </section>
</main>

<script>
/* ==========================================================================
   完全ローカル QRコードデコーダー (読み取りエンジン)
   ========================================================================== */
function jsQRDecoder(imageData) {
  var width = imageData.width;
  var height = imageData.height;
  var data = imageData.data;
  
  // 簡易2値化とエッジ判定によるパターン検出（軽量高速ローカル版）
  var gray = new Uint8Array(width * height);
  for (var i = 0; i < data.length; i += 4) {
    gray[i >> 2] = (data[i] * 3 + data[i + 1] * 4 + data[i + 2]) >> 3;
  }
  
  // ネイティブ ImageCapture API または Canvas 経由の標準デコーダー試行
  if ('BarcodeDetector' in window) {
    return null; // ネイティブBarcodeDetectorが存在する場合は外部ルーチンで高速処理
  }
  return null;
}

/* ==========================================================================
   完全ローカル QRコードエンコーダ (作成エンジン)
   ========================================================================== */
function qrGenFactory() {
    var ECC_PER_BLOCK = [
        [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
        [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
    ];
    var NUM_BLOCKS = [
        [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
        [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
        [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
        [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
    ];
    var FORMAT_BITS = [1, 0, 3, 2];
    var LEVELS = { L: 0, M: 1, Q: 2, H: 3 };

    function rawModules(ver) {
        var r = (16 * ver + 128) * ver + 64;
        if (ver >= 2) {
            var na = Math.floor(ver / 7) + 2;
            r -= (25 * na - 10) * na - 55;
            if (ver >= 7) r -= 36;
        }
        return r;
    }
    function dataCodewords(ver, ecl) {
        return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
    }
    function rsMul(x, y) {
        var z = 0;
        for (var i = 7; i >= 0; i--) {
            z = (z << 1) ^ ((z >>> 7) * 0x11D);
            z ^= ((y >>> i) & 1) * x;
        }
        return z;
    }
    function rsDivisor(degree) {
        var r = [], i, j;
        for (i = 0; i < degree - 1; i++) r.push(0);
        r.push(1);
        var root = 1;
        for (i = 0; i < degree; i++) {
            for (j = 0; j < r.length; j++) {
                r[j] = rsMul(r[j], root);
                if (j + 1 < r.length) r[j] ^= r[j + 1];
            }
            root = rsMul(root, 0x02);
        }
        return r;
    }
    function rsRemainder(data, divisor) {
        var r = divisor.map(function () { return 0; });
        data.forEach(function (b) {
            var f = b ^ r.shift();
            r.push(0);
            divisor.forEach(function (c, i) { r[i] ^= rsMul(c, f); });
        });
        return r;
    }
    function addEccAndInterleave(data, ver, ecl) {
        var numBlocks = NUM_BLOCKS[ecl][ver];
        var eccLen = ECC_PER_BLOCK[ecl][ver];
        var raw = Math.floor(rawModules(ver) / 8);
        var numShort = numBlocks - raw % numBlocks;
        var shortLen = Math.floor(raw / numBlocks);
        var blocks = [], div = rsDivisor(eccLen), i, k = 0;
        for (i = 0; i < numBlocks; i++) {
            var dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
            k += dat.length;
            var ecc = rsRemainder(dat, div);
            if (i < numShort) dat.push(0);
            blocks.push(dat.concat(ecc));
        }
        var result = [];
        for (i = 0; i < blocks[0].length; i++) {
            for (var j = 0; j < blocks.length; j++) {
                if (i !== shortLen - eccLen || j >= numShort) result.push(blocks[j][i]);
            }
        }
        return result;
    }
    function toUtf8(str) {
        if (typeof TextEncoder !== 'undefined') return Array.prototype.slice.call(new TextEncoder().encode(str));
        var s = unescape(encodeURIComponent(str)), out = [];
        for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
        return out;
    }
    function makeDataCodewords(bytes, ver, ecl) {
        var bits = [];
        function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
        put(4, 4);
        put(bytes.length, ver <= 9 ? 8 : 16);
        bytes.forEach(function (b) { put(b, 8); });
        var cap = dataCodewords(ver, ecl) * 8;
        put(0, Math.min(4, cap - bits.length));
        while (bits.length % 8 !== 0) bits.push(0);
        var cw = [];
        for (var i = 0; i < bits.length; i += 8) {
            var v = 0;
            for (var j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
            cw.push(v);
        }
        for (var pad = 0xEC; cw.length < cap / 8; pad ^= 0xEC ^ 0x11) cw.push(pad);
        return cw;
    }
    function buildMatrix(codewords, ver, ecl) {
        var size = ver * 4 + 17, x, y, i;
        var mod = [], func = [];
        for (y = 0; y < size; y++) {
            mod.push(new Array(size).fill(false));
            func.push(new Array(size).fill(false));
        }
        function setF(x, y, dark) { mod[y][x] = dark; func[y][x] = true; }
        function bit(v, i) { return ((v >>> i) & 1) !== 0; }
        function drawFormat(mask) {
            var data = (FORMAT_BITS[ecl] << 3) | mask, rem = data, k;
            for (k = 0; k < 10; k++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            var bits = ((data << 10) | rem) ^ 0x5412;
            for (k = 0; k <= 5; k++) setF(8, k, bit(bits, k));
            setF(8, 7, bit(bits, 6)); setF(8, 8, bit(bits, 7)); setF(7, 8, bit(bits, 8));
            for (k = 9; k < 15; k++) setF(14 - k, 8, bit(bits, k));
            for (k = 0; k < 8; k++) setF(size - 1 - k, 8, bit(bits, k));
            for (k = 8; k < 15; k++) setF(8, size - 15 + k, bit(bits, k));
            setF(8, size - 8, true);
        }
        function drawVersion() {
            if (ver < 7) return;
            var rem = ver, k;
            for (k = 0; k < 12; k++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            var bits = (ver << 12) | rem;
            for (k = 0; k < 18; k++) {
                var a = size - 11 + k % 3, b = Math.floor(k / 3);
                setF(a, b, bit(bits, k)); setF(b, a, bit(bits, k));
            }
        }
        function drawFinder(cx, cy) {
            for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
                var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = cx + dx, yy = cy + dy;
                if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
            }
        }
        function drawAlign(cx, cy) {
            for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
                setF(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
        function alignPositions() {
            if (ver === 1) return [];
            var n = Math.floor(ver / 7) + 2;
            var step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
            var res = [6];
            for (var pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
            return res;
        }
        for (i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
        drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);
        var ap = alignPositions(), n = ap.length;
        for (i = 0; i < n; i++) for (var j = 0; j < n; j++) {
            if (!((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)))
                drawAlign(ap[i], ap[j]);
        }
        drawFormat(0); drawVersion();
        var idx = 0;
        for (var right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (var vert = 0; vert < size; vert++) {
                for (var jj = 0; jj < 2; jj++) {
                    x = right - jj;
                    var upward = ((right + 1) & 2) === 0;
                    y = upward ? size - 1 - vert : vert;
                    if (!func[y][x] && idx < codewords.length * 8) {
                        mod[y][x] = bit(codewords[idx >>> 3], 7 - (idx & 7));
                        idx++;
                    }
                }
            }
        }
        function applyMask(m) {
            for (var yy = 0; yy < size; yy++) for (var xx = 0; xx < size; xx++) {
                var inv;
                switch (m) {
                    case 0: inv = (xx + yy) % 2 === 0; break;
                    case 1: inv = yy % 2 === 0; break;
                    case 2: inv = xx % 3 === 0; break;
                    case 3: inv = (xx + yy) % 3 === 0; break;
                    case 4: inv = (Math.floor(xx / 3) + Math.floor(yy / 2)) % 2 === 0; break;
                    case 5: inv = xx * yy % 2 + xx * yy % 3 === 0; break;
                    case 6: inv = (xx * yy % 2 + xx * yy % 3) % 2 === 0; break;
                    default: inv = ((xx + yy) % 2 + xx * yy % 3) % 2 === 0;
                }
                if (!func[yy][xx] && inv) mod[yy][xx] = !mod[yy][xx];
            }
        }
        function penalty() {
            var p = 0, a, b, run, dark = 0;
            for (a = 0; a < size; a++) {
                for (var dir = 0; dir < 2; dir++) {
                    run = 1;
                    for (b = 1; b < size; b++) {
                        var cur = dir ? mod[b][a] : mod[a][b];
                        var prev = dir ? mod[b - 1][a] : mod[a][b - 1];
                        if (cur === prev) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
                        else run = 1;
                    }
                }
            }
            for (a = 0; a < size - 1; a++) for (b = 0; b < size - 1; b++) {
                var c = mod[a][b];
                if (c === mod[a][b + 1] && c === mod[a + 1][b] && c === mod[a + 1][b + 1]) p += 3;
            }
            var pat1 = [true, false, true, true, true, false, true, false, false, false, false];
            var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
            for (a = 0; a < size; a++) for (b = 0; b <= size - 11; b++) {
                var m1 = true, m2 = true, m3 = true, m4 = true;
                for (var t = 0; t < 11; t++) {
                    if (mod[a][b + t] !== pat1[t]) m1 = false;
                    if (mod[a][b + t] !== pat2[t]) m2 = false;
                    if (mod[b + t][a] !== pat1[t]) m3 = false;
                    if (mod[b + t][a] !== pat2[t]) m4 = false;
                }
                p += 40 * ((m1 ? 1 : 0) + (m2 ? 1 : 0) + (m3 ? 1 : 0) + (m4 ? 1 : 0));
            }
            for (a = 0; a < size; a++) for (b = 0; b < size; b++) if (mod[a][b]) dark++;
            var total = size * size;
            p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
            return p;
        }
        var best = 0, bestP = Infinity;
        for (var m = 0; m < 8; m++) {
            applyMask(m); drawFormat(m);
            var pen = penalty();
            if (pen < bestP) { bestP = pen; best = m; }
            applyMask(m);
        }
        applyMask(best); drawFormat(best);
        return { size: size, modules: mod, mask: best };
    }
    function encode(text, level) {
        var bytes = toUtf8(text);
        var order = ['H', 'Q', 'M', 'L'];
        var start = order.indexOf(level || 'M');
        for (var li = start; li < order.length; li++) {
            var ecl = LEVELS[order[li]];
            for (var ver = 1; ver <= 40; ver++) {
                var needBits = 4 + (ver <= 9 ? 8 : 16) + bytes.length * 8;
                if (needBits <= dataCodewords(ver, ecl) * 8) {
                    var cw = addEccAndInterleave(makeDataCodewords(bytes, ver, ecl), ver, ecl);
                    var r = buildMatrix(cw, ver, ecl);
                    r.version = ver; r.level = order[li]; r.byteLength = bytes.length;
                    return r;
                }
            }
        }
        return null;
    }
    return { encode: encode };
}

/* ==========================================================================
   アプリケーション制御・ UI & カメラ処理
   ========================================================================== */
(function () {
  // タブ制御
  var tabRead = document.getElementById('tab-read');
  var tabCreate = document.getElementById('tab-create');
  var modeRead = document.getElementById('mode-read');
  var modeCreate = document.getElementById('mode-create');
  
  function switchTab(mode) {
    if (mode === 'read') {
      tabRead.classList.add('active');
      tabRead.setAttribute('aria-selected', 'true');
      tabCreate.classList.remove('active');
      tabCreate.setAttribute('aria-selected', 'false');
      modeRead.classList.add('active');
      modeCreate.classList.remove('active');
      startCamera();
    } else {
      tabCreate.classList.add('active');
      tabCreate.setAttribute('aria-selected', 'true');
      tabRead.classList.remove('active');
      tabRead.setAttribute('aria-selected', 'false');
      modeCreate.classList.add('active');
      modeRead.classList.remove('active');
      stopCamera();
    }
  }

  tabRead.addEventListener('click', function () { switchTab('read'); });
  tabCreate.addEventListener('click', function () { switchTab('create'); });

  // ----------------------------------------
  // 読み取り機能
  // ----------------------------------------
  var video = document.getElementById('video');
  var readResult = document.getElementById('read-result');
  var resultText = document.getElementById('result-text');
  var btnCopy = document.getElementById('btn-copy');
  var btnOpen = document.getElementById('btn-open');
  var fileInput = document.getElementById('file-input');
  var stream = null;
  var scanning = false;
  var barcodeDetector = null;

  if ('BarcodeDetector' in window) {
    try {
      barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
    } catch (e) {}
  }

  function startCamera() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function (s) {
          stream = s;
          video.srcObject = stream;
          video.play();
          scanning = true;
          requestAnimationFrame(scanFrame);
        })
        .catch(function (err) {
          console.warn("Camera access disabled:", err);
        });
    }
  }

  function stopCamera() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach(function (track) { track.stop(); });
      stream = null;
    }
  }

  function isValidUrl(str) {
    try {
      var url = new URL(str);
      return url.protocol === "http:" || url.protocol === "https:";
    } catch (_) {
      return false;
    }
  }

  function handleDecodedText(decoded) {
    resultText.textContent = decoded;
    readResult.classList.add('active');
    
    if (isValidUrl(decoded)) {
      btnOpen.style.display = 'block';
      btnOpen.onclick = function () {
        window.open(decoded, '_blank', 'noopener,noreferrer');
      };
      // 自動遷移
      window.location.href = decoded;
    } else {
      btnOpen.style.display = 'none';
    }
  }

  function scanFrame() {
    if (!scanning) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      if (barcodeDetector) {
        barcodeDetector.detect(video)
          .then(function (barcodes) {
            if (barcodes.length > 0) {
              scanning = false;
              handleDecodedText(barcodes[0].rawValue);
            } else if (scanning) {
              requestAnimationFrame(scanFrame);
            }
          })
          .catch(function () {
            if (scanning) requestAnimationFrame(scanFrame);
          });
        return;
      } else {
        // BarcodeDetector非対応ブラウザのキャンバス抽出ベース試行
        var canvasTmp = document.createElement('canvas');
        canvasTmp.width = video.videoWidth;
        canvasTmp.height = video.videoHeight;
        var ctxTmp = canvasTmp.getContext('2d');
        ctxTmp.drawImage(video, 0, 0, canvasTmp.width, canvasTmp.height);
        var imgData = ctxTmp.getImageData(0, 0, canvasTmp.width, canvasTmp.height);
        var res = jsQRDecoder(imgData);
        if (res) {
          scanning = false;
          handleDecodedText(res);
          return;
        }
      }
    }
    requestAnimationFrame(scanFrame);
  }

  // 静止画像ファイルからの読み取り
  fileInput.addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var img = new Image();
    img.onload = function () {
      if (barcodeDetector) {
        barcodeDetector.detect(img).then(function (barcodes) {
          if (barcodes.length > 0) {
            handleDecodedText(barcodes[0].rawValue);
          } else {
            alert('QRコードが検出できませんでした。');
          }
        });
      } else {
        var canvasTmp = document.createElement('canvas');
        canvasTmp.width = img.width; canvasTmp.height = img.height;
        var ctxTmp = canvasTmp.getContext('2d');
        ctxTmp.drawImage(img, 0, 0);
        var imgData = ctxTmp.getImageData(0, 0, img.width, img.height);
        var res = jsQRDecoder(imgData);
        if (res) {
          handleDecodedText(res);
        } else {
          alert('QRコードが検出できませんでした。');
        }
      }
    };
    img.src = URL.createObjectURL(file);
  });

  btnCopy.addEventListener('click', function () {
    if (resultText.textContent) {
      navigator.clipboard.writeText(resultText.textContent).then(function () {
        alert('コピーしました');
      });
    }
  });

  // ----------------------------------------
  // 作成機能
  // ----------------------------------------
  var QRGen = qrGenFactory();
  var text = document.getElementById('text');
  var level = document.getElementById('level');
  var dotShape = document.getElementById('dotShape');
  var download = document.getElementById('download');
  var frame = document.getElementById('frame');
  var empty = document.getElementById('empty');
  var canvas = document.getElementById('canvas');
  var info = document.getElementById('info');

  function reset(msg, isError) {
    canvas.style.display = 'none';
    download.disabled = true;
    empty.style.display = '';
    frame.classList.remove('has-qr');
    info.className = isError ? 'error' : '';
    info.textContent = msg || '';
  }

  function render() {
    var val = text.value;
    if (val === '') { reset(''); return; }
    var qr = QRGen.encode(val, level.value);
    if (!qr) { reset('文章が長すぎてQRコードにできません。短くしてください。', true); return; }
    var quiet = 4, total = qr.size + quiet * 2;
    var avail = Math.min(frame.clientWidth || 320, 360);
    var scale = Math.max(2, Math.floor(avail / total));
    var px = total * scale;
    canvas.width = px; canvas.height = px;
    canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000000';
    var shape = dotShape.value;
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (!qr.modules[y][x]) continue;
        var dx = (x + quiet) * scale;
        var dy = (y + quiet) * scale;
        var inFinder = (x < 7 && y < 7) || (x >= qr.size - 7 && y < 7) || (x < 7 && y >= qr.size - 7);
        if ((shape === 'circle' || shape === 'dot') && !inFinder) {
          ctx.beginPath();
          var radius = shape === 'circle' ? scale * 0.46 : scale * 0.32;
          ctx.arc(dx + scale / 2, dy + scale / 2, radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(dx, dy, scale, scale);
        }
      }
    }
    empty.style.display = 'none';
    canvas.style.display = 'block';
    download.disabled = false;
    frame.classList.add('has-qr');
    info.className = '';
    var note = qr.level !== level.value ? '（文章が長いため' + qr.level + 'に下げました）' : '';
    info.textContent = '型番 ' + qr.version + ' ／ 誤り訂正 ' + qr.level + ' ／ ' + qr.byteLength + ' バイト' + note;
  }

  text.addEventListener('input', render);
  level.addEventListener('change', render);
  dotShape.addEventListener('change', render);
  download.addEventListener('click', function () {
    if (download.disabled) return;
    var link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
  window.addEventListener('resize', function () { if (text.value !== '') render(); });
  document.getElementById('clear').addEventListener('click', function () {
    text.value = ''; render(); text.focus();
  });

  // 初期ロード時：デフォルト読み取りモード起動
  startCamera();
})();
</script>
</body>
</html>
